<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Pastry — Stitch Café</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#f2930d",
            "background-light": "#f8f6f5",
            "background-dark": "#1a100c"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            serif: ["Instrument Serif", "serif"]
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    .glass-card {
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .text-glow {
        text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#1a1c18] dark:text-white antialiased">
  <div
    class="relative mx-auto w-full max-w-7xl min-h-screen flex flex-col shadow-2xl overflow-hidden bg-background-light dark:bg-background-dark">
    
    <header class="absolute top-0 left-0 w-full z-20 flex items-center justify-between p-4">
      <button onclick="history.back()"
        class="size-10 flex items-center justify-center rounded-full bg-white/20 backdrop-blur-md text-white active:scale-95 transition-transform">
        <span class="material-symbols-outlined flip-rtl">arrow_back</span>
      </button>
      <div class="flex items-center gap-3">
        <!-- Language Toggle -->
        <div id="language-toggle" class="language-toggle scale-90 lang-en">
          <div class="toggle-switch">
            <span class="slider"></span>
          </div>
        </div>
        <button id="search-btn"
          class="size-10 flex items-center justify-center rounded-full bg-white/20 backdrop-blur-md text-white active:scale-95 transition-transform">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
    </header>

    <div class="relative w-full h-[360px] overflow-hidden flex flex-col items-center justify-center bg-cover bg-center"
      style="background-image: url('../assets/images/artisanal bread.jpg');">
      <div class="absolute inset-0 bg-black/30"></div>
      <div
        class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
      </div>
      <div class="relative z-10 flex flex-col items-center text-center px-6 pt-32">
        <h1 class="text-white text-[32px] font-extrabold tracking-tight leading-tight drop-shadow-md"
          data-i18n="pastery_title">Fresh Pastries</h1>
        <p class="text-white/90 text-sm font-medium mt-1 drop-shadow-sm" data-i18n="pastery_subtitle">Baked Fresh at 5 AM</p>
      </div>
    </div>

    <!-- Explorer Row (Unified) -->
    <div id="explore-categories"
      class="flex overflow-x-auto no-scrollbar gap-2 px-4 md:px-8 pb-0 w-full mb-8 pt-8">
          <!-- 1 Tea & Infusion -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../tea and infusion sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/tea icon .png" alt="Tea &amp; Infusion" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="tea_infusion">Tea &amp; Infusion</p>
          </div>

          <!-- 2 Milkshake -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../milkshake sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/milkshake icon.png" alt="Milkshake" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="milkshake">Milkshake</p>
          </div>

          <!-- 3 Juice -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../juces sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/juces icon.png" alt="Juice" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="juice">Juice</p>
          </div>

          <!-- 4 Cold Drinks -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../cold drinks sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/Cold drinks icon.jpg" alt="Cold Drinks" loading="lazy"
                    class="w-full h-full object-cover transform scale-[0.85] group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="cold_drinks">Cold Drinks</p>
          </div>

          <!-- 5 Sweet Pastries -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../sweet pastries sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/sweet pastry icon.png" alt="Sweet Pastries" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="sweet_pastries">Sweet Pastries</p>
          </div>

          <!-- 6 Pastry -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../artisanal bread sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/pastry,.jpg" alt="Pastry" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="pastry">Pastry</p>
          </div>

          <!-- 8 Fast Food -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../fast food sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/Snack Food.jpg" alt="Fast Food" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="fast_food">Fast Food</p>
          </div>

          <!-- 9 Black Coffee -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../black coffee sub catégorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/black coffe icon.jpg" alt="Black Coffee" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="black_coffee">Black Coffee</p>
          </div>

          <!-- 10 Latte -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../latt%C3%A9 hot drink sub cat%C3%A9gorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub catégories icons/latt%C3%A9 icon.jpg" alt="Latte" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="latte">Latte</p>
          </div>

          <!-- 11 Smoothie -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../smothie sub cat%C3%A9gorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub cat%C3%A9gories icons/smoothie icon.png" alt="Smoothie" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="smoothie">Smoothie</p>
          </div>

          <!-- 12 Toast -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../toast brunch sub cat%C3%A9gorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub cat%C3%A9gories icons/sandwich or toast icon .jpg" alt="Toast" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="toast">Toast</p>
          </div>

          <!-- 13 Breakfast -->
          <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group"
            onclick="window.location.href='../petit dejeuner sub cat%C3%A9gorie page/index.html'">
            <div class="p-[3px] rounded-full bg-gray-200 dark:bg-gray-700 group-hover:bg-primary transition-all">
              <div class="bg-white dark:bg-[#1a100c] p-1 rounded-full">
                <div class="w-16 h-16 rounded-full overflow-hidden relative">
                  <img src="../images/sub cat%C3%A9gories icons/Breakfast.jpg" alt="Breakfast" loading="lazy"
                    class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                    onerror="this.onerror=null;this.src='../assets/waiter.jpg'">
                </div>
              </div>
            </div>
            <p class="text-[10px] text-gray-800 dark:text-white text-center leading-tight max-w-[5rem]"
              data-i18n="breakfast">Breakfast</p>
          </div>

    </div>

    <!-- Filters Section -->
    <div class="flex gap-2.5 px-4 overflow-x-auto no-scrollbar py-6">
        <button
            class="filter-btn active px-5 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-lg shadow-primary/20"
            data-filter="all" data-i18n="all">All</button>
        <button
            class="filter-btn px-5 h-9 rounded-full bg-white dark:bg-zinc-800 text-zinc-500 text-xs font-semibold border border-zinc-100 dark:border-zinc-700"
            data-filter="viennoiserie" data-i18n="viennoiserie">Viennoiserie</button>
        <button
            class="filter-btn px-5 h-9 rounded-full bg-white dark:bg-zinc-800 text-zinc-500 text-xs font-semibold border border-zinc-100 dark:border-zinc-700"
            data-filter="patisserie" data-i18n="patisserie">Patisserie</button>
    </div>

    <!-- Promo Bento Cards -->
    <div class="px-4 space-y-4">
        <div class="grid grid-cols-2 gap-3 h-[280px]">
            <div class="relative rounded-[20px] overflow-hidden bg-zinc-900 group h-full">
                <div class="absolute inset-0 bg-cover bg-center opacity-70 group-hover:scale-105 transition-transform duration-500"
                    data-alt="Vertical shot of signature pour over"
                    style="background-image: url('../assets/images/artisanal bread.jpg');">
                </div>
                <div
                    class="absolute bottom-0 left-0 p-4 w-full bg-gradient-to-t from-black/80 via-black/20 to-transparent">
                    <p class="text-white font-bold text-base leading-tight">Signature Pour Over</p>
                    <p class="text-primary text-xs font-bold mt-1">6.50DH</p>
                </div>
            </div>
            <div class="grid grid-rows-2 gap-3 h-full">
                <div class="relative rounded-[20px] overflow-hidden bg-zinc-200 h-full">
                    <div class="absolute inset-0 bg-cover bg-center" data-alt="Close up of coffee beans"
                        style="background-image: url('../images/header images of sub catégorie/sweet pastries header image.jpg');">
                    </div>
                    <div class="absolute inset-0 bg-black/30 flex items-center justify-center p-4">
                        <p class="text-white text-[10px] font-bold uppercase tracking-[0.1em] text-center">New Origins
                        </p>
                    </div>
                </div>
                <div
                    class="relative rounded-[20px] overflow-hidden bg-primary/5 flex flex-col items-center justify-center text-center p-4 border border-primary/20 h-full">
                    <span class="material-symbols-outlined text-primary text-2xl mb-1">loyalty</span>
                    <p class="text-[10px] font-bold text-primary uppercase tracking-tighter">Rewards</p>
                    <p class="text-[#1c160d] text-[10px] font-bold">2x Points Today</p>
                </div>
            </div>
        </div>
    <div class="px-4 pt-2 pb-3 flex items-center justify-between">
        <h2 class="text-[20px] font-bold" data-i18n="popular_picks">Popular Picks</h2>
        <span class="text-primary text-xs font-bold cursor-pointer" data-i18n="view_all">View All</span>
    </div>

    <!-- Product Grid -->
    <div id="product-list" class="px-1.5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 pb-32">
        <!-- Dynamic Content from script.js -->
    </div>

    <script src="../nav-bar.js?v=9"></script>
    <script src="script.js"></script>
</body>

</html>
